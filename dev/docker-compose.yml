name: dbaguy-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dbaguy
      POSTGRES_PASSWORD: dbaguy
      POSTGRES_DB: dbaguy
    ports:
      - "127.0.0.1:54317:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbaguy -d dbaguy"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    # Lets the non-SUPER dev account create functions and triggers (the binary log is on by default in 8.4: error 1419).
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: dbaguy
      MYSQL_USER: dbaguy
      MYSQL_PASSWORD: dbaguy
      MYSQL_DATABASE: dbaguy
    ports:
      - "127.0.0.1:33067:3306"
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Healthy means "the dbaguy account can log in over TCP". The image's temporary init server has no networking,
      # so this passes only after the seed scripts have run and the real server is up.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -udbaguy -pdbaguy dbaguy -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 90
      start_period: 20s

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64  # Rosetta on Apple Silicon (OrbStack); ready in about 15-30 s
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Dbaguy_dev1
    ports:
      - "127.0.0.1:14337:1433"
    healthcheck:
      # Healthy means "seeded": `up --wait` does not wait for the one-shot mssql-init, so this checks the seed's last
      # step (dbaguy.dbo.seed_done) instead of the server alone.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SET NOCOUNT ON; IF OBJECT_ID('dbaguy.dbo.seed_done') IS NULL RAISERROR('not seeded', 16, 1)\" >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 100
      start_period: 30s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      - mssql
    environment:
      MSSQL_SA_PASSWORD: Dbaguy_dev1
    volumes:
      - ./mssql:/mssql:ro
    entrypoint: ["/bin/bash", "/mssql/seed.sh"]  # seeds once, then stays up idle (R-03b-P1)
    restart: "no"

  bastion:
    build: ./bastion
    ports:
      - "127.0.0.1:2222:22"
    depends_on:
      - postgres
      - mysql
      - mssql
