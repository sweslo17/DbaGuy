[project]
name = "dbaguy-backend"
version = "0.1.0"
description = "DbaGuy backend sidecar"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.143,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "loguru>=0.7.3,<1",
    "psycopg[binary]>=3.3.6,<4",
    "keyring>=25.7,<26",
    "sqlglot>=30.23,<31",
    "mysql-connector-python>=26.7.0,<27",
    "pymssql>=2.4.4,<3",
]

[tool.poetry]
packages = [{ include = "dbaguy_backend" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
httpx = "^0.28"
pyinstaller = "^6.22"

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Pending decision: migrate TestClient to httpx2 (Starlette 1.8+).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
