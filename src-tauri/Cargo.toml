[package]
name = "dbaguy"
version = "0.1.0"
edition = "2021"

[lib]
name = "dbaguy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.7"
tauri-plugin-clipboard-manager = "2.5"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tokio = { version = "1", features = ["time"] }
